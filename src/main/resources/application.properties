spring.application.name=login_service
# Backend now bound only to localhost and port aligned with nginx proxy (proxy_pass http://127.0.0.1:5000/)
server.port=5000
server.address=127.0.0.1
# Forward headers so Spring correctly detects original scheme/host when behind nginx
server.forward-headers-strategy=framework

spring.datasource.url=jdbc:mysql://localhost:3306/janasikhsha_db
spring.datasource.username=jpkuser
spring.datasource.password=Jpk@2025

spring.jpa.hibernate.ddl-auto=update
# Disable SQL logging in production (was true)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Mail settings
# Direct connection to Brevo SMTP (bypassing local Postfix issues)
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:apikey}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.mime.charset=UTF-8
spring.mail.properties.mail.debug=true
# Set SMTP envelope sender (Return-Path) to a verified address in Brevo
spring.mail.properties.mail.smtp.from=${MAIL_FROM:jpkadmin@jpkindia.org}
# Enable debug logging
logging.level.org.springframework.mail=DEBUG
logging.level.org.eclipse.angus.mail=DEBUG
logging.level.com.jpk.login_service.auth.AuthService=DEBUG

# Mail sender identity for emails
app.mail.fromAddress=${MAIL_FROM:jpkadmin@jpkindia.org}
app.mail.fromName=${MAIL_FROM_NAME:JPK India}

# Frontend URLs for password reset link
app.frontend.base-url=${FRONTEND_BASE_URL:https://jpkindia.org}
app.frontend.reset-path=${FRONTEND_RESET_PATH:/reset_password}

# JWT secret now externalized (set SECURITY_JWT_SECRET env variable). Fallback is placeholder.
security.jwt.secret=${SECURITY_JWT_SECRET:change-this-in-prod-please}
security.jwt.issuer=login-service
security.jwt.ttl-seconds=3600

# (Optional) expose health endpoint if you use /api/actuator/health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true